name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # الاختبارات تعمل على PostgreSQL حقيقي — النظام يعتمد على أنواع وقيود
    # خاصة به، واختباره على محرك آخر يعني اختبار نظام مختلف عن المنشور.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitflow
          POSTGRES_PASSWORD: fitflow
          POSTGRES_DB: fitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow -d fitflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow
      POSTGRES_DB: fitflow_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci_secret_key_at_least_32_characters_long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # الافتراضي يبحث عن uv.lock، ونحن نثبّت من pyproject.toml مباشرة
          # لا عبر uv sync. بدون توجيهه يفشل الإجراء عند حساب مفتاح الكاش،
          # فتموت الوظيفة قبل تشغيل أي فحص.
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (black)
        run: .venv/bin/black --check .

      - name: Type check (mypy strict)
        run: .venv/bin/mypy app

      - name: Migrations are reversible (upgrade → downgrade → upgrade)
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Tests
        run: .venv/bin/python -m pytest

      # المواصفة والأنواع المولَّدة منها **محفوظتان في الريبو**: بدونهما لا
      # تُبنى الواجهة في نسخة جديدة ولا في صورة Docker (سياقها مجلد
      # frontend وحده). الفحص هنا يمنع الثمن المعتاد لذلك — أن تتقادم
      # النسخة المحفوظة بصمت — بأن يفشل البناء لو اختلفت عن المولَّدة.
      - name: The committed OpenAPI schema is current
        run: |
          .venv/bin/python -m app.cli.export_openapi openapi.json
          git diff --exit-code openapi.json \
            || { echo "::error::openapi.json قديم — شغّل: make openapi"; exit 1; }

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    # مستقلة عن وظيفة الباك اند: كل واحدة تتحقق من نصفها من العقد
    # المحفوظ في الريبو، فتعملان بالتوازي بدل الانتظار.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: The committed API types match the schema
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/generated.ts \
            || { echo "::error::الأنواع المولَّدة قديمة — شغّل: make openapi"; exit 1; }

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker — production images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
