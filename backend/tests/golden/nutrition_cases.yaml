# حالات مرجعية لمحرك القواعد — Golden Tests
#
# محسوبة من معادلة Mifflin-St Jeor مباشرة بسكربت مستقل عن كود المحرك،
# لا بتشغيل المحرك وتسجيل ناتجه. الحالة الأخيرة تجعل الاختبار يوثّق
# السلوك الحالي مهما كان؛ الحساب المستقل هو ما يجعله يكشف الخطأ.
#
# أي تعديل على هذه القيم يحتاج مراجعة أخصائي تغذية معتمد (ADR-003).

