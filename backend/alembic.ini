[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# رابط الاتصال يأتي من الإعدادات (متغيرات البيئة) داخل alembic/env.py،
# فلا يُكتب هنا حتى لا تتسرب بيانات الاعتماد إلى الريبو.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
