default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        entry: backend/.venv/bin/mypy
        args: ["--config-file=backend/pyproject.toml", "backend/app"]
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false

      - id: frontend-lint
        name: eslint + prettier (frontend)
        entry: bash -c 'cd frontend && npm run lint && npm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false
